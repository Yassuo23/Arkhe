<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkhe</title>
  <link rel="icon" href="../Images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav>
    <h1>Arkhe</h1>
    <p>Seu novo amigo está aqui!</p>
  </nav>

  <div class="container">
    <div class="informacoes">
      <div>
        <h2>📞 Telefone para Contato</h2>
        <p><a href="tel:(19)97122-5729">(19) 97122-5729</a></p>
      </div>

      <div>
        <h2>📍 Localização</h2>
        <p>Rua dos Animais, 123 - Limeira, SP</p>
      </div>

      <div>
        <h2>🕓 Horário de Atendimento</h2>
        <p>Segunda a Sexta, 9h às 18h</p>
      </div>
    </div>

    <div class="contato">
      <h1>Entre em Contato Conosco 🐾</h1>
      <form action="#" method="post">
        <input type="text" name="nome" placeholder="Nome completo" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="mensagem" rows="5" placeholder="Mensagem" required></textarea>
        <button type="submit">Enviar Mensagem</button>
      </form>
    </div>
  </div>

  <div class="voltar">
    <a href="index.html">← Voltar para a página inicial</a>
  </div>

</body>
</html>
