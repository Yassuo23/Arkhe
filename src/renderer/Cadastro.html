<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro para adoção de um amigo">
  <title>ARKHE | Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="icon" href="favicon.png" type="image/x-icon">
</head>

<body>
  <div class="tudo">
    <header>
      <h1>ARKHE</h1>
      <h2>Cadastre-se para adotar um amigo</h2>
    </header>

    <main>
      <form id="FormSingUp">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="name">Nome completo</label>
          <input type="text" id="name" name="name" autocomplete="name" required>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="exemplo@gmail.com" required >

          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="password" placeholder="MinhaSenha123" required>

          <label for="birthday">Data de nascimento</label>
          <input type="date" id="birthday" name="birthday" autocomplete="bday">

          <label for="tel">Telefone</label>
          <input type="tel" id="tel" name="tel" autocomplete="tel">
        </fieldset>

        <div id="botoes">
          <button type="submit">Cadastrar</button>
        </div>
      </form>
    </main>

    <nav class="voltar" aria-label="Navegação secundária">
      <a href="login.html">Login</a>
    </nav>
  </div>
  <script src="js/cadastro.js"></script>
</body>

</html>
